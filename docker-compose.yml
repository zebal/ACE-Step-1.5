version: '3.8'

services:
  acestep:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: acestep_local
    ports:
      - "7860:7860"
    volumes:
      # Esto guarda los modelos pesados para que no se descarguen cada vez que reinicies
      - acestep_data:/root/.cache/huggingface 
    restart: unless-stopped

volumes:
  acestep_data:
