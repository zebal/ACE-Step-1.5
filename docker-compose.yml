version: '3.8'

services:
  acestep:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: acestep_local
    ports:
      # Exponemos la interfaz web en el puerto 19080 de tu Portainer
      - "19080:7860"
    volumes:
      # Guardamos los modelos de IA para no bajarlos cada vez
      - acestep_data:/root/.cache/huggingface 
    restart: unless-stopped

volumes:
  acestep_data:
